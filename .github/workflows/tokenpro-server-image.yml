name: TokenPro Server Image

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - Dockerfile
      - .github/workflows/tokenpro-server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tokenpro-server-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read TokenPro server version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ ! "$version" =~ ^TokenPro-R[0-9]+-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid TokenPro server version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zzz-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/zzz-backend:latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=tokenpro-server
          cache-to: type=gha,mode=max,scope=tokenpro-server

      - name: Publish summary
        run: |
          echo "### TokenPro server image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/zzz-backend:${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
