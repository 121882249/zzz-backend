name: TokenPro Server Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tokenpro-server-image-0.2.25-tp.1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 45dff7b19d674b63b4521e3417814f800ddcf787

      - name: Read TokenPro server version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "$version" != 0.2.25-tp.1 ]]; then
            echo "Invalid TokenPro server version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Linux image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zzz-backend:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=45dff7b19d674b63b4521e3417814f800ddcf787
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=tokenpro-server
          cache-to: type=gha,mode=max,scope=tokenpro-server

      - name: Verify published binary version and revision
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/zzz-backend@${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          version="$(docker run --rm --entrypoint /app/sub2api "$IMAGE" -version 2>&1)"
          printf '%s\n' "$version"
          [[ "$version" == *'Sub2API 0.2.25-tp.1 (commit: 45dff7b19d674b63b4521e3417814f800ddcf787,'* ]]

      - name: Publish summary
        run: |
          echo "### TokenPro server image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/zzz-backend:${{ steps.version.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
